[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = [
    "constants.py", "lib.py", "decks.py", "harness.py", "immutable.py",
    "bots.py", "bot_info.py", "bot_runner.py", "player.py", "example_bots.py",
]
